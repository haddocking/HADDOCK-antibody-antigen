name: unittests py27

on: pull_request

jobs:
  build:
    runs-on: ubuntu-20.04
    container:
      image: python:2.7.18-buster

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install coverage[toml] tox

      - name: Test
        if: always()
        run: tox -e py27
